name: Build PerfectGrabberNG roothide deb

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.deb"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install build tools
        run: |
          command -v dpkg-deb >/dev/null 2>&1 || brew install dpkg
          # ldid 三级兜底：brew 经常抽风（formulae 改名 / 仓库超时），
          # 最后直接从 ProcursusTeam/ldid 的 release 拉预编译二进制，不依赖 brew。
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid: 镜像已自带"
          elif brew install ldid-procursus 2>/dev/null; then
            echo "ldid: brew ldid-procursus"
          elif brew install procursus/ldid/ldid 2>/dev/null; then
            echo "ldid: brew tap procursus/ldid"
          else
            echo "ldid: brew 全部失败，改用预编译二进制"
            TAG=v2.1.5-procursus7
            if [ "$(uname -m)" = "arm64" ]; then ASSET=ldid_macosx_arm64; else ASSET=ldid_macosx_x86_64; fi
            curl -sL --fail --max-time 180 -o /tmp/ldid_bin \
              "https://github.com/ProcursusTeam/ldid/releases/download/$TAG/$ASSET"
            mkdir -p "$HOME/.local/bin"
            mv /tmp/ldid_bin "$HOME/.local/bin/ldid"
            chmod +x "$HOME/.local/bin/ldid"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          command -v ldid >/dev/null 2>&1 || { echo "ERROR: ldid not available"; exit 1; }
          echo "ldid OK"

      - name: Clean stale debs
        run: rm -f *.deb

      - name: Build
        run: bash build.sh

      - name: Verify deb
        run: |
          set -e
          DEB=$(ls com.sykes.perfectgrabberng_*_iphoneos-arm64e.deb | head -1)
          echo "deb: $DEB"
          # (1) 路径必须根相对，不能有 ./var/jb 或 ./var/roothide 前缀
          if dpkg-deb -c "$DEB" | grep -E '\./var/(jb|roothide)/'; then
            echo "ERROR: 检测到 ./var/jb 或 ./var/roothide 前缀"; exit 1
          fi
          dpkg-deb -c "$DEB" | grep -E '\./Library/MobileSubstrate/DynamicLibraries/PerfectGrabberNG\.dylib' || { echo "ERROR: 缺 dylib"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E '\./Library/MobileSubstrate/DynamicLibraries/PerfectGrabberNG\.dylib\.roothidepatch$' || { echo "ERROR: 缺 .roothidepatch 标记"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E '\./Library/MobileSubstrate/DynamicLibraries/PerfectGrabberNG\.plist' || { echo "ERROR: 缺 filter plist"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E '\./Library/PreferenceBundles/PerfectGrabberNG\.bundle/PerfectGrabberNG' || { echo "ERROR: 缺设置面板 bundle"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E '\./Library/PreferenceLoader/Preferences/PerfectGrabberNG\.plist' || { echo "ERROR: 缺 PreferenceLoader 入口"; exit 1; }
          echo "  (1) OK 路径与文件齐全"
          # (2) 解包校验签名与 filter
          rm -rf /tmp/pgcheck && mkdir -p /tmp/pgcheck
          dpkg-deb -x "$DEB" /tmp/pgcheck
          DYLIB=/tmp/pgcheck/Library/MobileSubstrate/DynamicLibraries/PerfectGrabberNG.dylib
          m=$(xxd -p -l4 "$DYLIB" | tr -d '\n')
          [ "$m" = "cafebabe" ] || { echo "ERROR: dylib magic=$m"; exit 1; }
          # install name 必须是 @loader_path/.jbroot（roothide 规范）
          IDS="$(otool -D "$DYLIB" | grep -v 'architecture' | grep -v '^$' | sort -u)"
          echo "  install name: $IDS"
          echo "$IDS" | grep -q "@loader_path/.jbroot" \
            || { echo "ERROR: LC_ID_DYLIB 不是 roothide 规范: $IDS"; exit 1; }
          ldid -e "$DYLIB" >/dev/null 2>&1 || { echo "WARN: ldid -e 无输出（ad-hoc 签名可能为空，非致命）"; }
          # filter 支持三种模式：
          # 1. Bundles 白名单（AltList 手动勾选）
          # 2. Executables 白名单（进程名匹配）
          # 3. 空 filter（V2.0.16+：零自动注入，用 roothideinject 手动指定）
          FILTER_PLIST=/tmp/pgcheck/Library/MobileSubstrate/DynamicLibraries/PerfectGrabberNG.plist
          if grep -q "<key>Bundles</key>" "$FILTER_PLIST"; then
            grep -q "com.sykes.pgng.disabled" "$FILTER_PLIST" || { echo "ERROR: Bundles 白名单为空或未设置占位符"; exit 1; }
            echo "  (2b) OK filter=Bundles 白名单模式"
          elif grep -q "<key>Executables</key>" "$FILTER_PLIST"; then
            grep -q "<string>GenshinImpact</string>" "$FILTER_PLIST" || { echo "ERROR: Executables 白名单未包含 GenshinImpact"; exit 1; }
            echo "  (2b) OK filter=Executables 白名单模式"
          elif grep -q "<dict>\s*$" "$FILTER_PLIST" && grep -q "^<\/dict>$" "$FILTER_PLIST"; then
            # 空 filter（V2.0.16+）：零自动注入，用 roothideinject 手动指定
            echo "  (2c) OK filter=空 filter（roothideinject 手动注入模式）"
          else
            echo "ERROR: filter 格式不支持（需要 Bundles/Executables 白名单或空 filter）"
            exit 1
          fi
          echo "  (2) OK dylib 头正常 + install name 规范 + filter 白名单模式正确"
          echo "全部校验通过"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: perfectgrabberng-deb
          path: "*.deb"
          retention-days: 30

      - name: Commit deb back
        run: |
          git config user.email "sykeswzq@users.noreply.github.com"
          git config user.name "sykeswzq"
          git add "*.deb" || true
          git commit -m "chore: build ${GITHUB_RUN_NUMBER} [skip ci]" || echo "no changes"
          git pull --rebase origin main || true
          git push origin main || true

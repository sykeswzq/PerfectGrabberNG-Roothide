name: Build PerfectGrabberNG roothide deb

on:
  push:
    branches: [main]
    # 忽略 "Commit deb back" 步骤推回 main 的 .deb 提交，避免自触发循环白烧 run
    paths-ignore:
      - "*.deb"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install build tools
        run: |
          command -v dpkg-deb >/dev/null 2>&1 || brew install dpkg
          # ldid 三级兜底：brew 经常抽风（ formulae 改名 / 仓库超时），
          # 最后直接从 ProcursusTeam/ldid 的 release 拉预编译二进制，不依赖 brew。
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid: 镜像已自带"
          elif brew install ldid-procursus 2>/dev/null; then
            echo "ldid: brew ldid-procursus"
          elif brew install procursus/ldid/ldid 2>/dev/null; then
            echo "ldid: brew tap procursus/ldid"
          else
            echo "ldid: brew 全部失败，改用预编译二进制"
            TAG=v2.1.5-procursus7
            if [ "$(uname -m)" = "arm64" ]; then ASSET=ldid_macosx_arm64; else ASSET=ldid_macosx_x86_64; fi
            curl -sL --fail --max-time 180 -o /tmp/ldid_bin \
              "https://github.com/ProcursusTeam/ldid/releases/download/$TAG/$ASSET"
            mkdir -p "$HOME/.local/bin"
            mv /tmp/ldid_bin "$HOME/.local/bin/ldid"
            chmod +x "$HOME/.local/bin/ldid"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          command -v ldid >/dev/null 2>&1 || { echo "ERROR: ldid not available"; exit 1; }
          echo "ldid OK"

      - name: Clean stale debs
        run: rm -f *.deb

      - name: Build
        run: bash build.sh

      - name: Verify deb
        run: |
          set -e
          DEB=$(ls com.sykes.perfectgrabberng_*_iphoneos-arm64e.deb | head -1)
          echo "deb: $DEB"
          # (1) 路径必须根相对，不能有 ./var/jb 或 ./var/roothide 前缀
          if dpkg-deb -c "$DEB" | grep -E '\./var/(jb|roothide)/'; then
            echo "ERROR: 检测到 ./var/jb 或 ./var/roothide 前缀"; exit 1
          fi
          dpkg-deb -c "$DEB" | grep -E '\./Library/MobileSubstrate/DynamicLibraries/PerfectGrabberNG\.dylib' || { echo "ERROR: 缺 dylib"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E '\./Library/MobileSubstrate/DynamicLibraries/PerfectGrabberNG\.dylib\.roothidepatch$' || { echo "ERROR: 缺 .roothidepatch 标记"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E '\./Library/MobileSubstrate/DynamicLibraries/PerfectGrabberNG\.plist' || { echo "ERROR: 缺 filter plist"; exit 1; }
          # setuid root helper：面板靠它把白名单写进 root 权限的 filter plist
          dpkg-deb -c "$DEB" | grep -E '\./usr/bin/pgngfilter$' || { echo "ERROR: 缺 setuid helper"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E '\./usr/bin/pgngfilter$' | grep -q -- '-rwsr-xr-x' || { echo "ERROR: helper 未保留 setuid 位"; exit 1; }
          # 面板 bundle 三件套（借 AltList 读 App 数据 + 自写控制器）
          dpkg-deb -c "$DEB" | grep -E '\./Library/PreferenceBundles/PerfectGrabberNG\.bundle/PerfectGrabberNG$' || { echo "ERROR: 缺面板可执行"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E '\./Library/PreferenceBundles/PerfectGrabberNG\.bundle/Info\.plist' || { echo "ERROR: 缺面板 Info.plist"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E '\./Library/PreferenceLoader/Preferences/PerfectGrabberNG\.plist' || { echo "ERROR: 缺 PreferenceLoader 入口"; exit 1; }
          echo "  (1) OK 路径与文件齐全（dylib + marker + 面板 bundle）"
          # (2) control 必须带 Choicy 范式依赖，且无维护脚本
          rm -rf /tmp/pgctrl && dpkg-deb -e "$DEB" /tmp/pgctrl
          CTRL="$(cat /tmp/pgctrl/control)"
          echo "---- control ----"; echo "$CTRL"; echo "-----------------"
          echo "$CTRL" | grep -q "Pre-Depends: rootless-compat" || { echo "ERROR: control 缺 Pre-Depends rootless-compat"; exit 1; }
          echo "$CTRL" | grep -q "Depends:.*com.opa334.altlist" || { echo "ERROR: control 缺 Depends com.opa334.altlist"; exit 1; }
          echo "$CTRL" | grep -q "Depends:.*preferenceloader" || { echo "ERROR: control 缺 Depends preferenceloader"; exit 1; }
          echo "$CTRL" | grep -q "Depends:.*mobilesubstrate" || { echo "ERROR: control 缺 Depends mobilesubstrate"; exit 1; }
          if [ -d pkg/DEBIAN ]; then
            # 注：postinst/postrm 已允许（对齐 Choicy/锤子助手范式，重启 runningboardd）
            for s in preinst prerm; do
              [ -f "pkg/DEBIAN/$s" ] && { echo "ERROR: 出现维护脚本 $s"; exit 1; }
            done
          fi
          echo "  (2) OK control 范式正确（rootless-compat + altlist + preferenceloader + mobilesubstrate，带 postinst/postrm）"
          # (3) 解包校验签名与 filter
          rm -rf /tmp/pgcheck && mkdir -p /tmp/pgcheck
          dpkg-deb -x "$DEB" /tmp/pgcheck
          DYLIB=/tmp/pgcheck/Library/MobileSubstrate/DynamicLibraries/PerfectGrabberNG.dylib
          m=$(xxd -p -l4 "$DYLIB" | tr -d '\n')
          [ "$m" = "cafebabe" ] || { echo "ERROR: dylib magic=$m"; exit 1; }
          # ★ 第一层保险：filter 必须是 Bundles 白名单（精准注入），绝不能退化成 Classes 全局注入
          /usr/libexec/PlistBuddy -c "Print :Filter:Bundles:0" /tmp/pgcheck/Library/MobileSubstrate/DynamicLibraries/PerfectGrabberNG.plist | grep -q "com.sykes.pgng.disabled" || { echo "ERROR: filter 不是 Bundles 白名单（会退化为全局注入）"; exit 1; }
          # ★ 第二层保险：dylib 不得强链接 UIKit（Choicy 式轻量）+ install name 必须是 roothide 规范
          if otool -L "$DYLIB" | grep -q "UIKit.framework"; then echo "ERROR: dylib 仍在强链接 UIKit"; exit 1; fi
          otool -D "$DYLIB" | grep -q "@loader_path/.jbroot" || { echo "ERROR: LC_ID_DYLIB 不是 roothide 规范"; exit 1; }
          echo "  (3) OK 头正常 + filter=Bundles 精准注入 + 无 UIKit 强链接 + install name 规范"
          echo "全部校验通过"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: perfectgrabberng-deb
          path: "*.deb"
          retention-days: 30

      - name: Commit deb back
        run: |
          git config user.email "sykeswzq@users.noreply.github.com"
          git config user.name "sykeswzq"
          git add "*.deb" || true
          git commit -m "chore: build ${GITHUB_RUN_NUMBER} [skip ci]" || echo "no changes"
          git pull --rebase origin main || true
          git push origin main || true
